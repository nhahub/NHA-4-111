<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Staff Account | Fit Core</title>
    <link rel="stylesheet" href="/CSS/style.css">
    <link rel="stylesheet" href="/CSS/management.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body data-page="staff">

    <div id="sidebar-container"></div>

    <main class="main-content">
        <div id="header-container"></div>

        <div class="page-content">
            <div class="page-header">
                <div>
                    <span class="badge">STAFF ADMINISTRATION</span>
                    <h1>Create Staff Account</h1>
                    <p class="subtitle">Add a new Trainer or Receptionist to the FitCore team.</p>
                </div>
            </div>

            <div id="msgBanner" class="msg-banner"></div>

            <div class="card" style="max-width: 640px;">
                <h2>Staff Details</h2>

                <form id="staffForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="fullName" class="text-input" placeholder="Sarah Youssef" required>
                        </div>
                        <div class="form-group">
                            <label>Role</label>
                            <select id="role" required>
                                <option value="Trainer">Trainer</option>
                                <option value="Receptionist">Receptionist</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="email" class="text-input" placeholder="sarah@fitcore.com" required>
                        </div>
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel" id="phoneNumber" class="text-input" placeholder="+1 (555) 000-0000" required>
                        </div>
                    </div>
                    <div class="form-grid" style="grid-template-columns: 1fr;">
                        <div class="form-group">
                            <label>Temporary Password</label>
                            <input type="password" id="password" class="text-input" placeholder="At least 6 characters" required minlength="6">
                        </div>
                    </div>

                    <button type="submit" class="btn-primary w-100" id="createBtn" style="margin-top: 8px;">
                        <i class="fa-solid fa-user-tie"></i> Create Staff Account
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="/JS/Auth/auth-common.js"></script>
    <script src="/JS/Components/layout.js"></script>
    <script src="/JS/Auth/staff-create.js"></script>
</body>
</html>
