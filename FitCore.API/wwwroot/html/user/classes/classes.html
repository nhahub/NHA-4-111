<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes | Fit Core</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/CSS/style.css">
    <link rel="stylesheet" href="/CSS/Classes/classes.css">
</head>
<body class="d-flex min-vh-100">

    <div id="sidebar-container"></div>

    <main class="flex-grow-1 d-flex flex-column overflow-y-scroll ">

        
        <header class="topbar d-flex justify-content-between align-items-center px-4 py-3 bg-transparent">
            <div class="search-box flex-grow-1 d-flex justify-content-center align-items-center bg-white border rounded-pill px-3 py-2 text-faint">
                <i class='bx bx-search fs-5'></i>
                <input type="text" id="searchInput" class="border-0 bg-transparent ms-2 w-100 text-dark m-auto" placeholder="Search classes, trainers, or schedules...">
            </div>
            <div class="topbar-actions d-flex gap-2 ms-4 bg-transparent">
                <button class="btn icon-btn border rounded-circle bg-white text-secondary p-0" aria-label="Notifications">
                    <i class='bx bx-bell fs-5'></i>
                </button>
                <button class="btn icon-btn border rounded-circle bg-white text-secondary p-0" aria-label="Settings">
                    <i class='bx bx-cog fs-5'></i>
                </button>
            </div>
        </header>

        <div class="container px-4 pb-5">

            <!-- مقدمة الصفحة الترحيبية -->
            <section class="page-intro mb-4 text-md-start text-center">
                <span class="d-inline-block text-primary text-uppercase fw-bold mb-2 fs-6" style=" letter-spacing: 0.08em;">Weekly Schedule</span>
                <h2 class="font-display fw-bold text-dark mb-2 fs-1 fs-md-3" style="font-size: 42px; letter-spacing: -0.02em;">Collective Energies</h2>
                <p class="text-muted mb-0" style="max-width: 520px; font-size: 15px; line-height: 1.5;">Discover your next breakthrough. Filter our curated classes by intensity, discipline, or master instructor.</p>
            </section>

            <!-- كبسولات تصنيفات الرياضات (Discipline Pills) -->
            <div class="d-flex flex-wrap gap-2 mb-3" id="disciplinePills">
                <button class="btn btn-pill bg-white border rounded-pill px-4 active " data-filter="All">All Classes</button>
                <button class="btn btn-pill bg-white border rounded-pill px-4" data-filter="Yoga">Yoga</button>
                <button class="btn btn-pill bg-white border rounded-pill px-4" data-filter="HIIT">HIIT</button>
                <button class="btn btn-pill bg-white border rounded-pill px-4" data-filter="Strength">Strength</button>
                <button class="btn btn-pill bg-white border rounded-pill px-4" data-filter="Spin">Spin</button>
            </div>

            <!-- عناصر الفلترة المتقدمة والتحكم بطريقة العرض -->
            <div class="d-flex align-items-center flex-wrap gap-3 mb-4 mt-3">

                <div class="d-flex align-items-center gap-2 bg-white border rounded px-3 py-2 text-muted" style="font-size: 13px;">
                    <i class='bx bx-slider-alt fs-6'></i>
                    <select id="trainerFilter" class="custom-select text-dark border-0 bg-transparent fw-medium" style="outline: none;">
                        <option value="">Filter by Trainer</option>
                    </select>
                </div>

                <div class="d-flex align-items-center gap-2 bg-white border rounded px-3 py-2 text-muted" style="font-size: 13px;">
                    <span class="fw-semibold text-secondary">From:</span>
                    <input type="date" id="fromDateInput" class="border-0 bg-transparent text-dark fw-medium" style="outline: none;">
                </div>

                <div class="d-flex align-items-center gap-2 bg-white border rounded px-3 py-2 text-muted" style="font-size: 13px;">
                    <span class="fw-semibold text-secondary">To:</span>
                    <input type="date" id="toDateInput" class="border-0 bg-transparent text-dark fw-medium" style="outline: none;">
                </div>

                <div class="ms-auto d-flex bg-white border rounded p-1 gap-1">
                    <button class="btn btn-sm btn-light border-0 active d-flex align-items-center justify-content-center px-2 py-1" id="gridViewBtn" aria-label="Grid view"><i class='bx bx-grid-alt fs-5'></i></button>
                    <button class="btn btn-sm bg-transparent border-0 text-secondary d-flex align-items-center justify-content-center px-2 py-1" id="listViewBtn" aria-label="List view"><i class='bx bx-list-ul fs-5'></i></button>
                </div>
            </div>

            <!-- شبكة عرض كروت الكلاسات المستدعاة ديناميكياً من السيرفر -->
            <section class="row g-4" id="classesGrid">
                <!-- يتم حقن الكروت هنا بواسطة ملف الـ JavaScript -->
            </section>

            <!-- زر تحميل المزيد من الكلاسات المتاحة -->
            <div class="d-flex justify-content-center mt-5">
                <button class="btn btn-light bg-white border text-dark font-body px-4 py-2 rounded-pill fw-semibold shadow-sm d-flex align-items-center gap-2" id="loadMoreBtn" style="font-size: 14px;">
                    Load More Classes <i class='bx bx-chevron-down fs-5'></i>
                </button>
            </div>

            <!-- قسم حجوزات المشترك الحالية المدمج بنفس طابع التصميم الفاخر للموقع -->
            <section class="mt-5 pt-5 border-top">
                <div class="d-flex align-items-center gap-2 mb-4">
                    <i class='bx bx-bookmark-heart text-primary fs-3'></i>
                    <h3 class="font-display fw-bold text-dark m-0" style="font-size: 26px; letter-spacing: -0.01em;">My Booked Energies</h3>
                </div>
                <div class="bg-white border rounded-4 overflow-hidden shadow-sm">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" style="font-size: 14px;">
                            <thead class="table-light text-secondary fw-semibold">
                                <tr>
                                    <th class="ps-4 py-3">Class Name</th>
                                    <th class="py-3">Session Date</th>
                                    <th class="py-3">Time Window</th>
                                    <th class="py-3">Status</th>
                                    <th class="pe-4 py-3 text-end">Action</th>
                                </tr>
                            </thead>
                            <tbody id="myBookingsTableBody">
                                <!-- يتم تعبئته ديناميكياً من الـ API -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <!-- نظام التنبيهات المنبثقة المطور (Toast) المعتمد على تصميمك الخاص -->
    <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-4" style="z-index: 1100;">
        <div id="statusToast" class="toast align-items-center text-bg-dark border-0 rounded-pill px-3 py-1 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex align-items-center">
                <div class="toast-body fw-medium font-body fs-6 w-100 text-center" id="toastMessage">
                    Action executed successfully!
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/JS/user/Components/layout.js"></script>
    <script src="/JS/user/Classes/classes.js"></script>
</body>
</html>
