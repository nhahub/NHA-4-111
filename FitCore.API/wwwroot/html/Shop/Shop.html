<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | FitCore</title>
    <link rel="stylesheet" href="/CSS/style.css">
    <link rel="stylesheet" href="/CSS/Shop/Shop.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body data-page="Shop">

    <div id="sidebar-container"></div>

    <main class="main-content shop-main">
        <div id="header-container"></div>

        <div class="shop-container">
            <div class="shop-heading">
                <div>
                    <h1 class="shop-title">Premium Gear</h1>
                    <p class="shop-desc">Curated performance equipment for the modern athlete.</p>
                </div>
                <button class="cart-toggle-btn" id="cartToggleBtn" type="button">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Cart</span>
                    <span class="cart-count" id="cartCount" style="display:none;">0</span>
                </button>
            </div>

            <div id="shopMsgBanner" class="msg-banner" style="display:none;"></div>

            <div id="products-grid" class="products-grid"></div>
            <p class="empty-state" id="productsEmptyState" style="display:none;">No products available right now.</p>
        </div>
    </main>

    <!-- Cart Drawer -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <aside class="cart-drawer" id="cartDrawer">
        <div class="cart-drawer-header">
            <h2>Your Cart</h2>
            <button class="icon-btn" id="closeCartBtn" aria-label="Close cart"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="cart-items" id="cartItems"></div>
        <p class="empty-state" id="cartEmptyState" style="display:none;">Your cart is empty.</p>

        <div class="cart-drawer-footer">
            <div class="cart-total-row">
                <span>Total</span>
                <span id="cartTotal">$0.00</span>
            </div>
            <label class="cart-note-label" for="checkoutDescription">Order note (optional)</label>
            <input type="text" id="checkoutDescription" class="text-input" placeholder="e.g. Deliver to front desk">
            <button class="btn-primary w-100" id="checkoutBtn" type="button">Checkout</button>
        </div>
    </aside>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="/JS/user/Components/layout.js"></script>
    <script src="/JS/Shop/Shop.js"></script>
</body>
</html>
