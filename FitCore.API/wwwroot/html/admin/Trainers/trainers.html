<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainers & Staff | Fit Core</title>
    <link rel="stylesheet" href="/CSS/style.css">
    <link rel="stylesheet" href="/CSS/management.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/CSS/Classes/classes.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/CSS/style.css">
</head>
<body>

    <div id="sidebar-container"></div>

    <main class="main-content">
        <div id="header-container"></div>

        <div class="page-content container ">
            <div class="page-header py-3">
                <div class="flex flex-column gap-4">
                    <span class="badge">STAFF ADMINISTRATION</span>
                    <h1 class="primary-dark">Trainers & Receptionists</h1>
                    <p class="subtitle">Create staff profiles, set trainer working hours, and assign trainers to classes.</p>
                </div>
            </div>

            <div id="msgBanner" class="msg-banner"></div>

            <!-- Create staff profile -->
            <div class="card p-3 mb-4">
                <h2 class="fs-3 fw-bold text-center">Create Trainer / Receptionist Profile</h2>
                <div class="form d-flex gap-3 flex-column">
                    <div class="form-group">
                        <label for="staffFullName" class="form-label">Full Name</label>
                        <input type="text" id="staffFullName" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="staffEmail" class="form-label">Email</label>
                        <input type="email" id="staffEmail" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="staffPhone" class="form-label">Phone Number</label>
                        <input type="text" id="staffPhone" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="staffPassword" class="form-label">Password</label>
                        <input type="password" id="staffPassword" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="staffRole" class="form-label">Role</label>
                        <select id="staffRole" class="form-select">
                            <option value="Trainer">Trainer</option>
                            <option value="Receptionist">Receptionist</option>
                        </select>
                    </div>
                </div>
                <div class="form-grid d-flex gap-3 flex-column mt-3" id="trainerOnlyFields">
                    <div class="form-group">
                        <label for="staffSpecialization" class="form-label">Specialization</label>
                        <input type="text" id="staffSpecialization" class="form-control" placeholder="e.g. Strength & Conditioning">
                    </div>
                    <div class="form-group">
                        <label for="staffBio" class="form-label">Bio</label>
                        <input type="text" id="staffBio" class="form-control" placeholder="Short bio">
                    </div>
                </div>
                <button class="btn-primary my-3" id="createStaffBtn">Create Profile</button>
            </div>

            <!-- Working hours -->
            <div class="card p-3 mb-4">
                <h2 class="fs-3 fw-bold text-center">Trainer Working Hours</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="workingHoursTrainerSelect" class="form-label">Trainer</label>
                        <select id="workingHoursTrainerSelect" class="form-select"></select>
                    </div>
                </div>
                <div id="workingHoursRows"></div>
                <button class="btn-outline btn-sm mt-3" id="addWorkingHourRowBtn">+ Add Time Slot</button>
                <br><br>
                <button class="btn-primary" id="saveWorkingHoursBtn">Save Working Hours</button>
            </div>

            <!-- Trainers list -->
            <div class="search-box flex-grow-1 my-3 d-flex justify-content-center align-items-center bg-white border rounded-pill px-3 py-2 text-faint">
                <i class='bx bx-search fs-5'></i>
                <input type="text" id="searchInput" class="border-0 bg-transparent ms-2 w-100 text-dark m-auto" placeholder="Search classes, trainers, or schedules...">
            </div>

            <div class="table-responsive">
                <table id="trainersTable" class="table table-bordered">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Specialization</th>
                            <th>Working Hours</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
                <div class="pagination" id="paginationControls"></div>
            </div>
        </div>
    </main>

    <script src="/js/admin/Components/layout.js"></script>
    <script src="/JS/admin/Trainers/trainers.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
