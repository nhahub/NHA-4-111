<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>FitCore Admin - manage Class</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/CSS/Classes/classes.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/CSS/style.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <main class="main-content">
        <section class="container py-4">

            <a class="btn btn-primary rounded-4 shadow" href="https://localhost:7186/html/admin/classes/admin-classes.html" role="button"><i class="fa-solid fa-arrow-left"></i></a>

            <div class=" bg-white p-4 rounded-4 my-4 shadow">

                <h2 id="headerTitle" class="text-center fs-2 fw-bold text-primary">Create Class</h2>
                <form id="createClassForm" class="form d-flex gap-3 flex-column" style="grid-template-columns: 1fr;">
                    <div class="form-group">
                        <label for="adminClassName" class="form-label">Class Name</label>
                        <input type="text" id="adminClassName" class="form-control" placeholder="e.g., Morning Power Yoga" required>
                    </div>
                    <div class="form-group">
                        <label for="adminClassDesc" class="form-label">Description</label>
                        <textarea id="adminClassDesc" class="form-control" style="resize: none; height: 60px;" placeholder="Describe intensity, prerequisites..."></textarea>
                    </div>
                    <div class="align-items-center" style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3)">
                        <div class="form-group">
                            <label for="adminClassCapacity" class="form-label">Capacity</label>
                            <input type="number" id="adminClassCapacity" class="form-control" value="25" required>
                        </div>
                        <div class="form-group">
                            <label for="adminClassTrainerID" class="form-label">Trainer</label>
                            <select id="adminClassTrainerID" class="form-select " aria-label="Default select example">
                                <option value="">Select Trainer</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="numberOfSession" class="form-label">Number of Session</label>
                        <input type="number" id="numberOfSession" class="form-control" required>
                    </div>
                    <button id="SubmitBtn" type="submit" class="btn-primary" style="margin-top: var(--space-2)"><i class="fa-solid fa-floppy-disk"></i> Add New Class</button>
                </form>
            </div>
        </section>
    </main>
    <script src="/js/admin/Components/layout.js"></script>
    <script src="/JS/admin/classes/createClass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
