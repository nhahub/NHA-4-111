<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Class</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/CSS/style.css">
    <link rel="stylesheet" href="/CSS/Classes/classes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

    <div id="sidebar-container"></div>

    <main class="main-content">

        <section class="container py-4">

            <a class="btn btn-primary rounded-4 shadow mb-4" href="https://localhost:7186/html/admin/classes/admin-classes.html" role="button"><i class="fa-solid fa-arrow-left"></i></a>

            <div class="card shadow border-0 rounded-4">

                <div class="card-header bg-primary text-white py-3">
                    <h3 class="mb-0">
                        <i class="fa-solid fa-dumbbell"></i>
                        Class Details
                    </h3>
                </div>

                <div class="card-body">

                    <div class="row g-4">

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Class Name</label>
                            <input id="className" class="form-control" readonly>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Trainer</label>
                            <input id="trainerName" class="form-control" readonly>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Capacity</label>
                            <input id="capacity" class="form-control" readonly>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Status</label>
                            <input id="status" class="form-control" readonly>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold">Description</label>
                            <textarea id="description"
                                      rows="4"
                                      class="form-control"
                                      readonly></textarea>
                        </div>

                    </div>

                    <hr class="my-4">

                    <h5 class="fw-bold mb-3">
                        Weekly Schedule
                    </h5>

                    <div class="table-responsive">

                        <table class="table table-bordered align-middle">

                            <thead class="table-light">

                                <tr>
                                    <th>#</th>
                                    <th>Day</th>
                                    <th>Start Time</th>
                                    <th>End Time</th>
                                </tr>

                            </thead>

                            <tbody id="scheduleTable">
                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <script src="/js/admin/Components/layout.js"></script>
    <script src="/JS/admin/classes/view-class.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
