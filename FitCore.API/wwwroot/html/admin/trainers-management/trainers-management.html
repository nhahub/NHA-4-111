<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff | Fit Core Admin</title>
    <link rel="stylesheet" href="/CSS/style.css">
    <link rel="stylesheet" href="/CSS/trainers/trainers-management.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

    <div id="sidebar-container"></div>

    <main class="main-content">
        <div id="header-container"></div>

        <div class="page">
            <div class="page-header">
                <div>
                    <h1>Staff</h1>
                    <p class="subtitle">Create trainer and receptionist profiles, and manage trainer working hours.</p>
                </div>
            </div>

            <div id="msgBanner" class="msg-banner"></div>

            <div class="two-col">
                <div class="card">
                    <h2>Create Trainer / Receptionist</h2>
                    <div class="form-grid">
                        <div class="form-group"><label>Full Name</label><input type="text" id="staffFullName" class="text-input"></div>
                        <div class="form-group"><label>Email</label><input type="email" id="staffEmail" class="text-input"></div>
                        <div class="form-group"><label>Phone</label><input type="text" id="staffPhone" class="text-input"></div>
                        <div class="form-group"><label>Password</label><input type="password" id="staffPassword" class="text-input"></div>
                        <div class="form-group">
                            <label>Role</label>
                            <select id="staffRole">
                                <option value="1">Trainer</option>
                                <option value="3">Receptionist</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-grid" id="trainerOnlyFields">
                        <div class="form-group"><label>Specialization</label><input type="text" id="staffSpecialization" class="text-input"></div>
                        <div class="form-group"><label>Bio</label><input type="text" id="staffBio" class="text-input"></div>
                    </div>
                    <button class="btn-primary" id="createStaffBtn">Create Profile</button>
                </div>

                <div class="card">
                    <h2>Trainer Working Hours</h2>
                    <div class="form-group" style="margin-bottom: var(--space-4);">
                        <label>Trainer</label>
                        <select id="workingHoursTrainerSelect"></select>
                    </div>
                    <div id="workingHoursRows"></div>
                    <button class="btn-outline btn-sm" id="addWorkingHourRowBtn">+ Add Time Slot</button>
                    <div class="card-actions">
                        <button class="btn-primary" id="saveWorkingHoursBtn">Save Working Hours</button>
                    </div>
                </div>
            </div>

            <div class="table-container">
                <table class="table-responsive">
                    <thead>
                        <tr><th>ID</th><th>Name</th><th>Email</th><th>Specialization</th><th>Working Hours</th></tr>
                    </thead>
                    <tbody id="trainersTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="/JS/admin/Components/api.js"></script>
    <script>
        window.FITCORE_LAYOUT_CONFIG = {
            sidebar: 'admin',
            header: 'admin',
            activeNav: 'Staff',
            user: { name: 'Admin User', role: 'SUPER ADMIN', initials: 'AU' }
        };
    </script>
    <script src="/JS/admin/Components/layout.js"></script>
    <script src="/JS/admin/Trainers/trainers.js"></script>
    <script src="/JS/Auth/auth-common.js"></script>
</body>
</html>
